components:
  schemas:
    workspace:
      type: object
      properties:
        evaluation_context:
          type: object
          description: 'Server-controlled ADM evaluation context; supplied client values are ignored. Absence or an exempt, disabled, or unsupported outcome does not assert ADM conformance.'
          properties:
            policy_revision:
              type: integer
            evaluation_generation:
              type: integer
            engine_context:
              type: object
            workflow_state:
              type: string
            schema_mode:
              type: string
              enum: [partial, full]
            publication_token:
              type: integer
            outcome:
              type: string
              enum: [valid, invalid, exempt, disabled, unsupported]
        # STIX common properties
        workflow:
          type: object
          properties:
            state:
              type: string
              enum: ['work-in-progress', 'awaiting-review', 'reviewed', 'static', 'draft']
        collections:
          type: array
          items:
            $ref: '#/components/schemas/collection_reference'
        release_tracks:
          type: array
          description: 'Server-controlled. Reverse pointers to the release tracks whose current (latest) snapshot references this object revision. Maintained automatically as objects move through release-track tiers; client-supplied values are ignored.'
          items:
            $ref: '#/components/schemas/release_track_reference'
        attack_id:
          type: string
          description: 'ATT&CK ID (e.g., T1234, G0001). When creating a new version of an existing object, this must match the existing attack_id. When creating a new object, this field is generated by the backend and cannot be set.'
    release_track_reference:
      type: object
      properties:
        id:
          type: string
          description: 'The release track ID (release-track--<uuid>)'
        type:
          type: string
          enum: ['standard', 'virtual']
          description: 'The type of the referencing release track'
        tier:
          type: string
          enum: ['members', 'staged', 'candidates', 'quarantine']
          description: 'The tier of the release track that references this object revision; values match the snapshot tier array names'
        status:
          type: string
          enum: ['modified-in-place', 'work-in-progress', 'awaiting-review', 'reviewed']
          description: 'Track-scoped workflow status. Members are always reviewed; quarantined entries carry no status. modified-in-place is retained only for legacy data.'
      required:
        - id
        - tier
    collection_reference:
      type: object
      properties:
        collection_ref:
          type: string
        collection_modified:
          type: string
          format: date-time
      required:
        - collection_ref
        - collection_modified
