components:
  schemas:
    validation-reconciliation:
      type: object
      required: [status, policy_revision, generation, counts, checkpoint, last_error, progress]
      properties:
        status:
          type: string
          enum: [pending, running, completed, failed, superseded]
        policy_revision:
          type: integer
        generation:
          type: integer
        counts:
          type: object
          additionalProperties:
            type: integer
        checkpoint:
          type: object
          nullable: true
        last_error:
          type: object
          nullable: true
        progress:
          type: object
          properties:
            processed:
              type: integer
            total:
              type: integer
              nullable: true
        engine_context:
          type: object

    system-version:
      type: object
      required:
        - name
        - version
        - gitCommit
        - buildDate
        - attackSpecVersion
      properties:
        name:
          type: string
          description: Name of the REST API component
          example: 'attack-workbench-rest-api'
        version:
          type: string
          description: Release version of the running REST API build
          example: '4.20.0-beta.23'
        gitCommit:
          type: string
          description: Git commit used to produce the running REST API build, or `unknown` when unavailable
          example: 'c2c017c146fae040caba559333b35536bfbd1189'
        buildDate:
          type: string
          description: RFC 3339 build timestamp, or `unknown` when unavailable
          example: '2026-08-05T15:13:49.915Z'
        attackSpecVersion:
          type: string
          description: ATT&CK specification version supported by the REST API

    allowed-values:
      type: object
      properties:
        objectType:
          type: string
          example: 'technique'
        properties:
          $ref: '#/components/schemas/allowedValuesForProperty'

    allowedValuesForProperty:
      type: array
      items:
        type: object
        properties:
          propertyName:
            type: string
            example: 'x_mitre_platforms'
          domains:
            $ref: '#/components/schemas/allowedValuesForDomain'

    allowedValuesForDomain:
      type: array
      items:
        type: object
        properties:
          domainName:
            type: string
            example: 'enterprise-attack'
          allowedValues:
            type: array
            items:
              type: string
              example: 'Linux'

    allowed-value-option:
      type: object
      additionalProperties: false
      required: [value, enabled, objectTypes]
      properties:
        value:
          type: string
          minLength: 1
          description: Trimmed, case-sensitive value accepted by the installed backend ADM for every selected object type and domain, even when disabled.
        enabled:
          type: boolean
        objectTypes:
          type: array
          minItems: 1
          uniqueItems: true
          description: Supported object types to which this option applies.
          items:
            type: string
            minLength: 1

    allowed-value-rule:
      type: object
      additionalProperties: false
      required: [propertyName, domainName, objectTypes, values, invalidValues]
      properties:
        propertyName:
          type: string
          example: x_mitre_platforms
        domainName:
          type: string
          example: enterprise-attack
        objectTypes:
          type: array
          uniqueItems: true
          description: All ADM-supported object types for this property/domain, including those with no options.
          items:
            type: string
        values:
          type: array
          description: Equal value and enabled pairs are grouped across object types.
          items:
            $ref: '#/components/schemas/allowed-value-option'
        invalidValues:
          type: array
          description: Persisted legacy options rejected by the installed ADM. Never offered as dropdown choices; saving replaces these along with the rule.
          items:
            $ref: '#/components/schemas/allowed-value-invalid-option'

    allowed-value-rule-replace:
      type: object
      additionalProperties: false
      required: [values]
      properties:
        values:
          type: array
          description: Complete replacement option set. An empty array clears the rule.
          items:
            $ref: '#/components/schemas/allowed-value-option'

    allowed-value-invalid-option:
      type: object
      additionalProperties: false
      required: [value, enabled, objectTypes, reason]
      properties:
        value:
          type: string
        enabled:
          type: boolean
        objectTypes:
          type: array
          items:
            type: string
        reason:
          type: string

    allowed-value-definition:
      type: object
      additionalProperties: false
      required: [propertyName, domainName, objectTypes, valueType, choices, description]
      properties:
        propertyName:
          type: string
        domainName:
          type: string
        objectTypes:
          type: array
          items:
            type: string
        valueType:
          type: string
          enum: [enum, formatted]
        choices:
          type: array
          description: ADM enum choices, or validated seed suggestions for formatted fields. Each choice lists its valid object types.
          items:
            type: object
            required: [value, objectTypes]
            additionalProperties: false
            properties:
              value:
                type: string
              objectTypes:
                type: array
                items:
                  type: string
        description:
          type: string

    allowed-value-catalog:
      type: object
      additionalProperties: false
      required: [admVersion, rules]
      properties:
        admVersion:
          type: string
        rules:
          type: array
          items:
            $ref: '#/components/schemas/allowed-value-definition'

    allowed-value-rule-create:
      type: object
      additionalProperties: false
      required: [propertyName, domainName, values]
      properties:
        propertyName:
          type: string
          minLength: 1
        domainName:
          type: string
          minLength: 1
        values:
          type: array
          description: Initial ADM-valid options. Empty arrays create a persistent empty rule.
          items:
            $ref: '#/components/schemas/allowed-value-option'

    allowed-value-validate:
      type: object
      additionalProperties: false
      required: [propertyName, domainName, objectTypes, value]
      properties:
        propertyName:
          type: string
          minLength: 1
        domainName:
          type: string
          minLength: 1
        objectTypes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            minLength: 1
        value:
          type: string
          minLength: 1

    organization-identity:
      type: object
      properties:
        id:
          type: string
          example: 'identity--76abfbed-a92f-4e2a-953e-dc83f90ecddc'

    authn-mechanism:
      type: object
      properties:
        authnType:
          type: string
          example: 'oidc'

    default-marking-definition-ids:
      type: array
      items:
        type: string
        example: 'marking-definition--a0262641-9222-4e26-b5f5-f44c59fb3230'

    organization-namespace:
      type: object
      properties:
        range_start:
          type: number
          example: 4000
        prefix:
          type: string
          example: 'MYORG'

    mitre-identity-writes:
      type: object
      required:
        - enabled
      properties:
        enabled:
          type: boolean
          description: Whether create and update requests for the protected MITRE identity are enabled.
          example: false

    validation-bypass-rule:
      oneOf:
        - $ref: '#/components/schemas/error-bypass-rule'
        - $ref: '#/components/schemas/object-exemption-rule'
    error-bypass-rule:
      type: object
      required:
        - fieldPath
        - errorCode
        - stixType
      properties:
        _id:
          type: string
          description: Database id of the validation bypass rule
        kind:
          type: string
          enum: [error-bypass]
          description: May be omitted for legacy error bypass payloads.
        fieldPath:
          type: array
          description: Zod issue path to match. Path segments are compared as strings.
          items:
            type: string
          example: ['x_mitre_modified_by_ref']
        errorCode:
          type: string
          description: Zod issue code to match.
          example: 'invalid_value'
        stixType:
          type: string
          description: STIX type to match, or `all` to match any STIX type.
          example: 'attack-pattern'
        suppressError:
          type: boolean
          description: Whether matching validation errors should be suppressed.
          default: true
        autoCreated:
          type: boolean
          description: Whether this rule was created automatically by system configuration.
          default: false
        autoCreatedReason:
          type: string
          nullable: true
          description: System reason for an automatically-created rule.
          example: 'static'
        triggerEvent:
          type: string
          nullable: true
          description: Event that created this rule, when applicable.
        warningMessage:
          type: string
          nullable: true
          description: Warning emitted when a matching validation error is bypassed.

    object-exemption-rule:
      type: object
      required: [kind, name, enabled, retirementStatus, stixTypes]
      properties:
        _id:
          type: string
          description: Stable database rule identity.
        kind:
          type: string
          enum: [object-exemption]
        name:
          type: string
          minLength: 1
          maxLength: 200
        enabled:
          type: boolean
        retirementStatus:
          type: string
          enum: [revoked, deprecated]
        stixTypes:
          description: All types or a nonempty normalized set of supported STIX types.
          oneOf:
            - type: string
              enum: [all]
            - type: array
              minItems: 1
              items:
                type: string
                enum:
                  [
                    attack-pattern,
                    campaign,
                    course-of-action,
                    identity,
                    intrusion-set,
                    malware,
                    marking-definition,
                    relationship,
                    tool,
                    x-mitre-analytic,
                    x-mitre-asset,
                    x-mitre-collection,
                    x-mitre-data-component,
                    x-mitre-data-source,
                    x-mitre-detection-strategy,
                    x-mitre-matrix,
                    x-mitre-tactic,
                  ]
        autoCreated:
          type: boolean
        autoCreatedReason:
          type: string
          nullable: true
        triggerEvent:
          type: string
          nullable: true
