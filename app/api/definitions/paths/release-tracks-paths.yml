paths:
  # =============================================================================
  # Ephemeral bundles
  # =============================================================================
  /api/release-tracks/ephemeral/{domain}:
    get:
      summary: 'Generate an ephemeral bundle for a domain'
      operationId: 'release-tracks-ephemeral-get'
      description: |
        Generate a stateless bundle containing all objects from a given ATT&CK domain.
        This endpoint queries the database by domain without persisting a release track.
        It supplants the deprecated GET /api/stix-bundles endpoint.
      tags:
        - 'Release Tracks'
      parameters:
        - name: domain
          in: path
          required: true
          description: 'ATT&CK domain'
          schema:
            type: string
            enum:
              - enterprise
              - ics
              - mobile
            example: 'enterprise'
        - name: format
          in: query
          description: 'Output format. filesystemstore is not yet implemented.'
          schema:
            type: string
            enum:
              - bundle
              - workbench
              - filesystemstore
            default: bundle
        - name: stixVersion
          in: query
          description: |
            STIX version that the exported bundle should conform to (bundle format only).
          schema:
            type: string
            enum:
              - '2.0'
              - '2.1'
            default: '2.1'
        - name: includeToc
          in: query
          description: |
            Whether to include a table-of-contents object (of type `x-mitre-collection`)
            in STIX 2.1 bundles (bundle format only). STIX 2.0 always omits it.
          schema:
            type: boolean
            default: true
        - name: includeObjectsWithMissingAttackId
          in: query
          description: |
            Whether to include objects that should have an ATT&CK ID set but do not
            (bundle format only).
          schema:
            type: boolean
            default: false
        - name: includeDeprecated
          in: query
          description: |
            Whether to include objects that have the `x_mitre_deprecated` property set to true
            (bundle format only).
          schema:
            type: boolean
            default: false
        - name: includeRevoked
          in: query
          description: |
            Whether to include objects that have the `revoked` property set to true
            (bundle format only).
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: 'Ephemeral bundle generated successfully'
        '501':
          description: 'Requested format is not yet implemented'

  # =============================================================================
  # Track management
  # =============================================================================
  /api/release-tracks:
    get:
      summary: 'List all release tracks'
      operationId: 'release-tracks-list'
      description: |
        Retrieve a paginated list of release track registry entries.
        Returns metadata about each track (not full snapshots).
      tags:
        - 'Release Tracks'
      parameters:
        - name: type
          in: query
          description: 'Filter by track type'
          schema:
            type: string
            enum:
              - standard
              - virtual
        - name: search
          in: query
          description: 'Search by name or description (case-insensitive)'
          schema:
            type: string
        - name: limit
          in: query
          description: 'Number of tracks to return (0 for all)'
          schema:
            type: number
            default: 0
        - name: offset
          in: query
          description: 'Number of tracks to skip'
          schema:
            type: number
            default: 0
      responses:
        '200':
          description: 'List of release tracks'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '../components/release-tracks.yml#/components/schemas/release-track-registry'
                  pagination:
                    type: object
                    properties:
                      total:
                        type: number
                      limit:
                        type: number
                      offset:
                        type: number

  /api/release-tracks/objects/{objectRef}/releases:
    get:
      summary: 'List tagged releases containing a STIX object'
      operationId: 'release-tracks-releases-by-object'
      description: |
        Return every tagged release-track snapshot whose members tier directly
        contains the supplied STIX ID. The result spans all object revisions.
        Drafts, non-member tiers, and secondary bundle-export objects are excluded.
      tags:
        - 'Release Tracks'
      parameters:
        - name: objectRef
          in: path
          required: true
          description: 'STIX ID to locate across tagged releases'
          schema:
            type: string
        - name: type
          in: query
          description: 'Restrict results to one release-track type'
          schema:
            type: string
            enum:
              - standard
              - virtual
        - name: order
          in: query
          description: 'Snapshot chronology order'
          schema:
            type: string
            enum:
              - asc
              - desc
            default: asc
        - name: limit
          in: query
          description: 'Maximum number of results to return'
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          description: 'Number of matching releases to skip'
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: 'Tagged releases containing the object'
          content:
            application/json:
              schema:
                type: object
                properties:
                  object_ref:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: '../components/release-tracks.yml#/components/schemas/release-by-object-entry'
                  pagination:
                    type: object
                    properties:
                      total:
                        type: integer
                      limit:
                        type: integer
                      offset:
                        type: integer
        '400':
          description: 'Malformed STIX ID or invalid query parameter'

  /api/release-tracks/new:
    post:
      summary: 'Create a new release track'
      operationId: 'release-tracks-create'
      description: |
        Create a new standard or virtual release track with an initial empty draft snapshot.
        Request body is validated via Zod (not OpenAPI). An optional config
        object accepts the same fields and validation rules as PUT
        /api/release-tracks/:id/config; omitted values receive model defaults.
        Virtual composition objects are strict, and component selectors must
        match their resolution_strategy. Component IDs and priorities must be
        unique, every priority is required, and referenced components must
        already exist as standard tracks; virtual-track nesting and native
        members are unsupported. Virtual snapshot schedules are strict by
        mode: manual accepts no selector, cron requires cron, and dates
        requires at least one date. Standard tracks reject snapshot_schedule.
        Virtual tracks may also accept a strict scheduled_materialization
        object containing schedule_mode and scheduled_for; it is persisted on
        the initial snapshot and returned by snapshot and track-list GETs.
        `description` is long-lived track metadata. The optional
        `snapshot_description` is a user-authored annotation on the initial
        draft snapshot and is limited to 4000 characters. `alias` is an
        optional URL-safe slug (2-64 lowercase letters, digits, and hyphens,
        unique across tracks) accepted wherever the track ID is.
      tags:
        - 'Release Tracks'
      # Request body validation moved to Zod in controller
      responses:
        '201':
          description: 'Release track created successfully'
          content:
            application/json:
              schema:
                $ref: '../components/release-tracks.yml#/components/schemas/release-track-snapshot'
        '400':
          description: 'Invalid request parameters'

  /api/release-tracks/new-from-bundle:
    post:
      summary: 'Create a release track from a STIX bundle'
      operationId: 'release-tracks-create-from-bundle'
      description: |
        Parse a STIX bundle and create a new release track with member objects extracted from x_mitre_contents.
        Request body validation moved to Zod in controller.
      tags:
        - 'Release Tracks'
      responses:
        '201':
          description: 'Release track created from bundle'
        '400':
          description: 'A bundle primary object is unsupported, invalid, or cannot be persisted'

  /api/release-tracks/import:
    post:
      summary: 'Import a release track'
      operationId: 'release-tracks-import'
      description: |
        Import a release track with all snapshots and version history.
        Request body validation moved to Zod in controller.
      tags:
        - 'Release Tracks'
      responses:
        '201':
          description: 'Release track imported successfully'
        '501':
          description: 'Not yet implemented'

  # =============================================================================
  # Track deletion
  # =============================================================================
  /api/release-tracks/{id}:
    delete:
      summary: 'Delete a release track'
      operationId: 'release-tracks-delete'
      description: |
        Delete an entire release track including all snapshots and version history.
        This administrator-only operation cannot be undone. The caller must
        confirm the exact target with confirm_track_id. The server writes a
        durable audit event before deletion begins.
      tags:
        - 'Release Tracks'
      parameters:
        - name: id
          in: path
          required: true
          description: 'Release track ID or alias'
          schema:
            type: string
        - name: confirm_track_id
          in: query
          required: true
          description: 'Must exactly equal the id path parameter'
          schema:
            type: string
      responses:
        '204':
          description: 'Release track deleted successfully'
        '404':
          description: 'Release track not found'
        '400':
          description: 'Missing or mismatched destructive confirmation'
        '401':
          description: 'Administrator role required'
        '500':
          description: 'The deletion may be persisted, but its durable audit or membership reconciliation failed'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '../components/release-tracks.yml#/components/schemas/release-track-audit-error'
                  - $ref: '../components/release-tracks.yml#/components/schemas/release-track-reconciliation-error'

  # =============================================================================
  # Latest snapshot operations
  # =============================================================================
  /api/release-tracks/{id}/meta:
    post:
      summary: 'Update metadata on the latest snapshot'
      operationId: 'release-tracks-update-meta-latest'
      description: |
        Update name, description, or alias. Name and description live on
        the snapshot, so changing either creates a new snapshot clone. The
        alias is registry-only routing metadata (a string sets it, null
        clears it) and an alias-only update returns the latest snapshot
        unchanged. Publication markings are configured through the track
        configuration. Request body validated via Zod in controller.
      tags:
        - 'Release Tracks'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'Metadata updated successfully'
          content:
            application/json:
              schema:
                $ref: '../components/release-tracks.yml#/components/schemas/release-track-snapshot'

  /api/release-tracks/{id}/clone:
    post:
      summary: 'Clone the latest snapshot into a new release track'
      operationId: 'release-tracks-clone-latest'
      description: |
        Create a new release track by cloning the latest snapshot.
        Request body validated via Zod in controller.
      tags:
        - 'Release Tracks'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: 'Release track cloned successfully'
        '409':
          description: 'The source snapshot references missing primary revisions'
          content:
            application/json:
              schema:
                $ref: '../components/release-tracks.yml#/components/schemas/object-revision-error'

  /api/release-tracks/{id}/snapshots/latest/release:
    post:
      summary: 'Release the latest snapshot'
      operationId: 'release-tracks-release-latest'
      description: |
        Publish the latest snapshot with a version. Standard tracks retain the
        exact draft and create a new tagged snapshot; virtual tracks tag the
        materialized draft in place. Standard tracks promote staged entries
        to members. Any staged `object_modified:
        "latest"` selector is resolved to the object's actual latest
        `stix.modified` timestamp during release planning; tagged members
        always contain exact revision timestamps. Supply either `increment`
        (`major` or `minor`) or an explicit `version` in `MAJOR.MINOR` form,
        but never both. Omitting both defaults to a minor increment. An
        optional `description` is stored as snapshot-local release notes.
        Relative increments use the latest tagged release. A historical
        standard draft is published as a new release at the current time and
        must follow the current version lineage.
      tags:
        - 'Release Tracks'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        description: |
          Version selection. `increment` and `version` are mutually exclusive;
          supplying both returns 400. An empty object defaults to a minor
          increment. `description` optionally sets snapshot-local notes and is
          limited to 4000 characters.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: 'Snapshot released successfully'
        '400':
          description: 'Invalid release request'
        '409':
          description: 'Already released, another release is in progress, conflicting snapshot, or missing persisted primary revisions'
        '500':
          description: 'The release may be tagged, but durable membership-protection reconciliation failed'
          content:
            application/json:
              schema:
                $ref: '../components/release-tracks.yml#/components/schemas/release-track-reconciliation-error'

  /api/release-tracks/{id}/snapshots/latest/release/preview:
    get:
      summary: 'Preview releasing the latest snapshot'
      operationId: 'release-tracks-preview-latest-release'
      description: |
        Plan without persisting. Summary is the default; workbench and bundle
        render the complete would-be release. `increment` and `version` are
        mutually exclusive; omitting both defaults to a minor increment.
        Standard preview plans resolve dynamic staged references exactly as a
        commit would and show staged-to-members promotion. Virtual summaries
        compare the persisted draft with its chronologically preceding tagged
        release; composition is never recomputed. A virtual draft whose
        composition has not been materialized returns 409.
        Summary responses include the exclusive lower and upper tagged
        snapshot version_bounds used by release planning.
      tags:
        - 'Release Tracks'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: format
          in: query
          description: 'Preview representation. Defaults to summary.'
          schema:
            type: string
            enum:
              - summary
              - bundle
              - workbench
              - filesystemstore
            default: summary
        - name: increment
          in: query
          description: 'Version increment; mutually exclusive with version.'
          schema:
            type: string
            enum: [major, minor]
        - name: version
          in: query
          description: 'Explicit MAJOR.MINOR version; mutually exclusive with increment.'
          schema:
            type: string
        - name: include
          in: query
          description: |
            Workbench previews only: which tier arrays to return
            (members | staged | candidates | quarantine | all). Bundle
            previews reject it with 400.
          schema:
            type: string
        - name: stixVersion
          in: query
          schema:
            type: string
            enum: ['2.0', '2.1']
      responses:
        '200':
          description: 'Release preview generated'
        '409':
          description: 'Virtual draft is unmaterialized, release is blocked by a conflict, or persisted primary revisions are missing'
        '501':
          description: 'Requested format is not yet implemented'

  # =============================================================================
  # Candidate management
  # =============================================================================
  /api/release-tracks/{id}/candidates:
    get:
      summary: 'List candidates in the latest snapshot'
      operationId: 'release-tracks-candidates-list'
      description: |
        Retrieve the candidates tier from the latest snapshot.
        Optionally filter by workflow status.
      tags:
        - 'Release Tracks'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: status
          in: query
          description: 'Filter by workflow status'
          schema:
            type: string
            enum:
              - modified-in-place
              - work-in-progress
              - awaiting-review
              - reviewed
      responses:
        '200':
          description: 'Candidates retrieved successfully'
          content:
            application/json:
              schema:
                type: object
                properties:
                  candidates:
                    type: array
                    items:
                      $ref: '../components/release-tracks.yml#/components/schemas/candidate-entry'

    post:
      summary: 'Add objects as candidates'
      operationId: 'release-tracks-candidates-add'
      description: |
        Add one or more objects to the candidates tier.
        If modified is omitted or 'latest', persist a dynamic selector that
        follows the latest object revision until release. An explicit ISO
        timestamp remains an exact pin. Dynamic selectors are preserved when
        promoted to staged and resolved only when staged content is released
        into immutable members.
        If that same selector is already pinned in any tier, the add is idempotently skipped.
        Different revisions of the same object may occupy different tiers.
        If auto_promote is enabled and candidates meet the threshold, they are auto-promoted to staged.
        Request body validated via Zod: { object_refs: Array<string | {id, modified}> }
      tags:
        - 'Release Tracks'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'Candidates added successfully'
        '400':
          description: 'A requested exact or latest object revision does not exist'

  /api/release-tracks/{id}/candidates/review:
    post:
      summary: 'Bulk transition candidate workflow status'
      operationId: 'release-tracks-candidates-review'
      description: |
        Transition candidates from one workflow status to another (forward-only).
        If auto_promote is enabled and candidates meet the threshold after transition, they are auto-promoted to staged.
        Tier changes retain a selector in only one tier and repair legacy cross-tier duplicates.
        `from` also accepts the server-assigned `modified-in-place` status; `to` accepts only the
        user-settable statuses (work-in-progress, awaiting-review, reviewed).
        Request body validated via Zod: { from, to, object_refs? }
      tags:
        - 'Release Tracks'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'Candidates reviewed successfully'

  /api/release-tracks/{id}/candidates/promote:
    post:
      summary: 'Manually promote candidates to staged'
      operationId: 'release-tracks-candidates-promote'
      description: |
        Manually promote specific candidates to the staged tier, bypassing auto-promotion logic.
        Applies conflict resolution policy only to different revisions of the same object.
        Exact revisions are retained in one tier, with members taking precedence.
        Request body validated via Zod: { object_refs: string[] }
      tags:
        - 'Release Tracks'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'Candidates promoted successfully'

  /api/release-tracks/{id}/candidates/{objectRef}:
    delete:
      summary: 'Remove a candidate'
      operationId: 'release-tracks-candidates-remove'
      description: |
        Remove all entries for a given object_ref from the candidates tier.
      tags:
        - 'Release Tracks'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: objectRef
          in: path
          required: true
          description: 'STIX ID of the object to remove'
          schema:
            type: string
      responses:
        '200':
          description: 'Candidate removed successfully'
        '404':
          description: 'Candidate not found'

  /api/release-tracks/{id}/candidates/{objectRef}/update-version:
    post:
      summary: 'Update the version pin of a candidate'
      operationId: 'release-tracks-candidates-update-version'
      description: |
        Change which version of an object is being tracked in the candidates tier.
        old_modified and new_modified may be exact ISO timestamps or "latest".
        If the new selector exactly matches another tier, the authoritative existing tier is retained.
        Request body validated via Zod: { old_modified, new_modified }
      tags:
        - 'Release Tracks'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: objectRef
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'Candidate version pin updated successfully'
        '400':
          description: 'The requested replacement revision does not exist'

  # =============================================================================
  # Staged objects
  # =============================================================================
  /api/release-tracks/{id}/staged:
    get:
      summary: 'List staged objects in the latest snapshot'
      operationId: 'release-tracks-staged-list'
      description: |
        Retrieve the staged tier from the latest snapshot.
      tags:
        - 'Release Tracks'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'Staged objects retrieved successfully'
          content:
            application/json:
              schema:
                type: object
                properties:
                  staged:
                    type: array
                    items:
                      $ref: '../components/release-tracks.yml#/components/schemas/staged-entry'

  /api/release-tracks/{id}/staged/demote:
    post:
      summary: 'Demote staged objects back to candidates'
      operationId: 'release-tracks-staged-demote'
      description: |
        Move objects from staged tier back to candidates tier.
        The modified selector may be an exact ISO timestamp or "latest".
        Applies into_candidates conflicts only to different selectors; exact
        duplicates remain in one tier.
        Request body validated via Zod: { object_refs: Array<{id, modified}> }
      tags:
        - 'Release Tracks'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'Staged objects demoted successfully'

  # =============================================================================
  # Configuration
  # =============================================================================
  /api/release-tracks/{id}/config:
    get:
      summary: 'Get release track configuration'
      operationId: 'release-tracks-config-get'
      description: |
        Retrieve the config sub-document from the latest snapshot.
      tags:
        - 'Release Tracks'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'Configuration retrieved successfully'
          content:
            application/json:
              schema:
                $ref: '../components/release-tracks.yml#/components/schemas/track-config'

    put:
      summary: 'Update release track configuration'
      operationId: 'release-tracks-config-update'
      description: |
        Merge configuration changes into the latest snapshot (creates new snapshot clone).
        Request body validated via Zod in controller.
      tags:
        - 'Release Tracks'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'Configuration updated successfully'

  # =============================================================================
  # Object version history
  # =============================================================================
  /api/release-tracks/{id}/objects/{objectRef}/versions:
    get:
      summary: 'List all versions of an object across tiers'
      operationId: 'release-tracks-object-versions'
      description: |
        Find all occurrences of a given object_ref across members, staged, and candidates tiers.
        Shows which versions are tracked in which tiers.
      tags:
        - 'Release Tracks'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: objectRef
          in: path
          required: true
          description: 'STIX ID of the object'
          schema:
            type: string
      responses:
        '200':
          description: 'Object versions retrieved successfully'
          content:
            application/json:
              schema:
                type: object
                properties:
                  versions:
                    type: array
                    items:
                      type: object
                      properties:
                        tier:
                          type: string
                          enum:
                            - members
                            - staged
                            - candidates
                        object_ref:
                          type: string
                        object_modified:
                          description: |
                            Exact timestamp for members, or an exact timestamp
                            or "latest" selector for candidates and staged.
                          oneOf:
                            - type: string
                              format: date-time
                            - type: string
                              enum:
                                - latest
                        object_status:
                          type: string
                          nullable: true

  # =============================================================================
  # Virtual track operations
  # =============================================================================
  /api/release-tracks/{id}/virtual/composition:
    put:
      summary: 'Update virtual track composition'
      operationId: 'release-tracks-composition-update'
      description: |
        Update which component tracks a virtual track aggregates. This
        operation is available only for tracks whose type is `virtual`.
        The new pending draft has empty members and quarantine tiers and a null
        composition_resolution. Materialize it before release preview or commit.
        Request body is strictly validated via Zod. Unknown composition,
        component, filter, and deduplication keys are rejected. latest_tagged and
        latest_draft reject selector fields; specific_version requires version;
        specific_snapshot requires snapshot. Component IDs and required
        non-negative integer priorities must each be unique.
        An optional strict scheduled_materialization object is persisted on the
        new pending virtual draft and returned by snapshot and track-list GETs.
      tags:
        - 'Release Tracks'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: 'Composition updated successfully'
        '400':
          description: 'Track is not virtual or composition is invalid'

  /api/release-tracks/{id}/virtual/schedule:
    put:
      summary: 'Update a virtual track snapshot schedule'
      operationId: 'release-tracks-schedule-update'
      description: |
        Replace the registry-backed materialization schedule for a virtual
        track without creating or mutating a content snapshot. Request bodies
        are strictly validated via Zod: manual accepts only mode, cron requires
        one five-field UTC expression, and dates requires at least one ISO UTC
        timestamp. Scheduler reconciliation observes the replacement on its
        next configured pass.
      tags:
        - 'Release Tracks'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: 'Snapshot schedule updated successfully'
          content:
            application/json:
              schema:
                type: object
                required:
                  - snapshot_schedule
                properties:
                  snapshot_schedule:
                    $ref: '../components/release-tracks.yml#/components/schemas/snapshot-schedule'
        '400':
          description: 'Track is not virtual or schedule is invalid'
        '404':
          description: 'Release track not found'

  /api/release-tracks/{id}/virtual/snapshots/create:
    post:
      summary: 'Create a virtual track snapshot'
      operationId: 'release-tracks-virtual-snapshot-create'
      description: |
        Resolve the configured component releases and persist a new virtual
        draft snapshot. The draft must subsequently be reviewed and explicitly
        released through the shared snapshot release endpoints. This operation
        is available only for tracks whose type is `virtual`.
        Every member and quarantine entry is persisted with an exact
        object_ref and object_modified revision. The resulting snapshot never
        follows later component track_latest activity, and snapshot retrieval
        does not re-resolve composition.
        Request body validated via Zod in controller. Clients may attach an
        optional strict scheduled_materialization object to the resulting
        virtual draft. `description` becomes the new snapshot's local notes;
        it does not replace the release track description.
        Component release locks are held from resolution through persistence.
        A concurrent release, rollback, retag, or materialization sharing a
        component may return 409; retry after the competing operation finishes.
      tags:
        - 'Release Tracks'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                description:
                  type: string
                  maxLength: 4000
                  description: 'Optional notes for this snapshot'
                scheduled_materialization:
                  $ref: '../components/release-tracks.yml#/components/schemas/scheduled-materialization'
      responses:
        '201':
          description: 'Virtual snapshot created successfully'
        '400':
          description: 'Track is not virtual or cannot resolve its composition'
        '409':
          description: 'A component release lock is busy or a resolved snapshot references missing primary revisions'
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '../components/release-tracks.yml#/components/schemas/object-revision-error'
                  - type: object
                    required: [message, track_id]
                    properties:
                      message:
                        type: string
                      track_id:
                        type: string

  /api/release-tracks/{id}/virtual/quarantine/promote:
    post:
      summary: 'Promote one quarantined revision to virtual members'
      operationId: 'release-tracks-virtual-quarantine-promote'
      description: |
        Resolve a conflict in the latest virtual snapshot by selecting one
        exact quarantined object revision. The operation clones the latest
        snapshot into a new draft, replaces any existing member revision for
        that object, and removes every quarantined alternative with the same
        object_ref. The source snapshot and its composition_resolution remain
        unchanged. Request body is strictly validated via Zod in the controller.
      tags:
        - 'Release Tracks'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: 'Quarantined revision promoted in a new virtual draft'
        '400':
          description: 'Track is not virtual or the request body is invalid'
        '404':
          description: 'The selected exact revision is not quarantined'
        '409':
          description: 'The resulting virtual snapshot would reference missing primary revisions'
          content:
            application/json:
              schema:
                $ref: '../components/release-tracks.yml#/components/schemas/object-revision-error'

  # =============================================================================
  # Snapshot-specific operations
  # =============================================================================
  /api/release-tracks/{id}/snapshots:
    get:
      summary: 'List snapshots for a release track'
      operationId: 'release-tracks-snapshots-list'
      description: |
        Return lightweight summaries of every snapshot in the release track,
        ordered by modified timestamp from newest to oldest. Standard snapshot
        summaries contain members, staged, and candidates counts. Virtual
        snapshot summaries contain members and quarantine counts, plus
        scheduled_materialization when present. Every summary exposes its
        content_manifest_id together with content_statistics counts for
        primary, relationship, supporting, and LinkById entries. Tagged
        summaries also expose bundle_id and bundle_hashes.
        Standard releases with a preserved source draft also expose
        release_source_modified, allowing clients to hide that retained draft.
      tags:
        - 'Release Tracks'
      parameters:
        - name: id
          in: path
          required: true
          description: 'Release track ID or alias'
          schema:
            type: string
        - name: tagged
          in: query
          description: |
            Filter by tagged state. true returns snapshots with a version;
            false returns untagged drafts. Omit to return both.
          schema:
            type: boolean
        - name: limit
          in: query
          description: 'Number of snapshot summaries to return'
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          description: 'Number of matching snapshot summaries to skip'
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: 'Snapshot summaries retrieved successfully'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - pagination
                properties:
                  data:
                    type: array
                    items:
                      oneOf:
                        - $ref: '../components/release-tracks.yml#/components/schemas/standard-snapshot-summary'
                        - $ref: '../components/release-tracks.yml#/components/schemas/virtual-snapshot-summary'
                  pagination:
                    type: object
                    required:
                      - total
                      - limit
                      - offset
                    properties:
                      total:
                        type: integer
                      limit:
                        type: integer
                      offset:
                        type: integer
        '400':
          description: 'Invalid filter or pagination parameter'
        '404':
          description: 'Release track not found'

  /api/release-tracks/{id}/snapshots/latest:
    get:
      summary: 'Get the latest snapshot of a release track'
      operationId: 'release-tracks-snapshot-get-latest'
      description: |
        Return the most recent full snapshot for a release track. Virtual
        snapshot membership is the exact revision set persisted during
        materialization; retrieval never re-resolves component tracks. Bundle
        formatting may append secondary relationships and supporting objects
        resolved at request time.
      tags:
        - 'Release Tracks'
      parameters:
        - name: id
          in: path
          required: true
          description: 'Release track ID or alias'
          schema:
            type: string
        - name: include
          in: query
          description: |
            Workbench responses only: which tier arrays to return (members,
            staged, candidates, quarantine, or all; default all). Bundles
            always replay the snapshot's sealed content manifest and reject
            include with 400.
          schema:
            type: string
        - name: format
          in: query
          description: 'Output format. filesystemstore is not yet implemented.'
          schema:
            type: string
            enum:
              - bundle
              - workbench
              - filesystemstore
            default: workbench
        - name: stixVersion
          in: query
          description: |
            STIX version for standard or materialized virtual snapshot bundle
            responses. STIX 2.0 adds spec_version to the bundle envelope and
            removes it from each bundled object; STIX 2.1 does the inverse.
          schema:
            type: string
            enum:
              - '2.0'
              - '2.1'
            default: '2.1'
      responses:
        '200':
          description: 'Latest snapshot retrieved successfully'
          content:
            application/json:
              schema:
                $ref: '../components/release-tracks.yml#/components/schemas/release-track-snapshot'
        '404':
          description: 'Release track not found'
        '409':
          description: 'The selected snapshot representation references missing primary revisions'
          content:
            application/json:
              schema:
                $ref: '../components/release-tracks.yml#/components/schemas/object-revision-error'
        '501':
          description: 'Requested format is not yet implemented'

  /api/release-tracks/{id}/snapshots/{modified}:
    get:
      summary: 'Get a specific snapshot by modified timestamp'
      operationId: 'release-tracks-snapshot-get'
      description: |
        Retrieve a historical snapshot identified by its modified timestamp.
        Use format=bundle to export the snapshot as a STIX bundle.
      tags:
        - 'Release Tracks'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: modified
          in: path
          required: true
          description: 'ISO 8601 timestamp'
          schema:
            type: string
        - name: include
          in: query
          description: |
            Workbench responses only: a single value controlling which tier
            arrays are returned — members | staged | candidates | quarantine |
            all (default: all). Bundles always replay the snapshot's sealed
            content manifest and reject include with 400.
          schema:
            type: string
        - name: format
          in: query
          description: 'Output format. filesystemstore is not yet implemented.'
          schema:
            type: string
            enum:
              - bundle
              - filesystemstore
              - workbench
            default: workbench
        - name: stixVersion
          in: query
          description: |
            STIX version that the exported standard or materialized virtual
            snapshot bundle should conform to (bundle format only). STIX 2.0
            adds spec_version to the bundle envelope and removes it from each
            bundled object; STIX 2.1 does the inverse.
          schema:
            type: string
            enum:
              - '2.0'
              - '2.1'
            default: '2.1'
      responses:
        '200':
          description: 'Snapshot retrieved successfully'
        '404':
          description: 'Snapshot not found'
        '409':
          description: 'The selected snapshot representation references missing primary revisions'
          content:
            application/json:
              schema:
                $ref: '../components/release-tracks.yml#/components/schemas/object-revision-error'
        '501':
          description: 'Requested format is not yet implemented'

    delete:
      summary: 'Delete the latest draft snapshot'
      operationId: 'release-tracks-snapshot-delete'
      description: |
        Delete the latest untagged draft snapshot by its modified timestamp
        (editor or higher); the track reverts to its immediately preceding
        snapshot. Tagged releases cannot be deleted, even by administrators:
        first use POST /snapshots/{modified}/draft to convert to a draft.
        Deletion is blocked for historical drafts, the only snapshot, preserved
        source drafts of tagged releases, and snapshots resolved by downstream
        virtual snapshots. Checks and deletion share the release lock.
      tags:
        - 'Release Tracks'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: modified
          in: path
          required: true
          schema:
            type: string
        - name: confirm_version
          in: query
          description: |
            Deprecated compatibility parameter. It does not authorize tagged
            deletion; tagged snapshots always return 409. Use the draft
            conversion endpoint instead.
          deprecated: true
          schema:
            type: string
      responses:
        '204':
          description: 'Snapshot deleted successfully'
        '409':
          description: 'Snapshot is tagged, protected, the only snapshot, or not the latest draft'
        '404':
          description: 'Snapshot not found'

  /api/release-tracks/{id}/snapshots/{modified}/draft:
    post:
      summary: 'Convert the latest tagged release back to a draft'
      operationId: 'release-tracks-release-to-draft'
      description: |
        Administrator-only conversion with exact version confirmation. Standard
        tracks restore the preserved source draft (whose modified timestamp is
        returned); virtual releases become drafts in place, preserving their
        sealed content and composition/creation provenance. Later drafts survive.
        Only the latest tagged release may be converted. Downstream virtual
        dependencies block conversion. Release history, catalogue, counters, and
        backrefs are reconciled and convert_release_to_draft is audited. Draft
        deletion is a separate operation with its own eligibility checks.
      tags: ['Release Tracks']
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: modified
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [confirm_version]
              properties:
                confirm_version:
                  type: string
                  pattern: '^\d+\.\d+$'
      responses:
        '200':
          description: 'Restored draft snapshot'
          content:
            application/json:
              schema:
                $ref: '../components/release-tracks.yml#/components/schemas/release-track-snapshot'
        '400':
          description: 'Version confirmation is missing, invalid, or incorrect'
        '403':
          description: 'Administrator role required'
        '404':
          description: 'Snapshot not found'
        '409':
          description: 'Not the latest tagged release, source draft unavailable, downstream dependency, or concurrent operation'

  /api/release-tracks/{id}/snapshots/{modified}/clone:
    post:
      summary: 'Clone a specific snapshot into a new release track'
      operationId: 'release-tracks-clone-by-modified'
      description: |
        Create a new release track by cloning a historical snapshot.
        Request body validated via Zod in controller.
      tags:
        - 'Release Tracks'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: modified
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: 'Release track cloned successfully'
        '409':
          description: 'The source snapshot references missing primary revisions'
          content:
            application/json:
              schema:
                $ref: '../components/release-tracks.yml#/components/schemas/object-revision-error'

  /api/release-tracks/{id}/snapshots/{modified}/description:
    put:
      summary: 'Set or clear a snapshot description'
      operationId: 'release-tracks-snapshot-description-update'
      description: |
        Replace the user-authored notes on one draft snapshot. Whitespace is
        trimmed; an empty string clears the notes. This annotation does not
        change the snapshot modified timestamp, tier contents, or
        release-track metadata. The notes become the emitted collection
        object's description, so a tagged snapshot is immutable and returns
        409; set release notes through the release request instead.
      tags:
        - 'Release Tracks'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: modified
          in: path
          required: true
          schema:
            type: string
            format: date-time
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - description
              additionalProperties: false
              properties:
                description:
                  type: string
                  maxLength: 4000
      responses:
        '200':
          description: 'Snapshot description updated successfully'
          content:
            application/json:
              schema:
                $ref: '../components/release-tracks.yml#/components/schemas/release-track-snapshot'
        '400':
          description: 'Invalid description payload'
        '404':
          description: 'Snapshot not found'
        '409':
          description: 'Delete the snapshot bundle cache before editing its notes'

  /api/release-tracks/{id}/snapshots/{modified}/graph/reconstruct:
    post:
      summary: 'Reconstruct a historical content manifest from source-bundle pointers'
      operationId: 'release-tracks-snapshot-graph-reconstruct'
      description: |
        Administrative recovery operation for a tagged historical snapshot.
        The caller derives exact revision pointers from an externally verified
        source bundle; the bundle itself is not imported. The server verifies
        that every pointer exists, roots exactly match snapshot members,
        relationship endpoint pins match the stored relationship, and all
        referenced endpoint and supporting objects are present. Versioned
        objects remain pointer-only; only unversioned marking definitions may
        carry a frozen payload. Repeating the same attestation is idempotent.
        Every tagged snapshot already has a sealed content manifest, so the
        request must name that manifest in `replace_manifest_id` to replace
        it; a different current manifest is rejected. Replacement recomputes
        the snapshot's bundle hashes.
      tags:
        - 'Release Tracks'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: modified
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../components/release-tracks.yml#/components/schemas/source-graph-reconstruction'
      responses:
        '200':
          description: 'The tagged snapshot already references a manifest with this attestation'
        '201':
          description: 'Source-attested content manifest replaced the previous manifest'
        '400':
          description: 'Malformed reconstruction plan'
        '404':
          description: 'Snapshot or exact object revision not found'
        '409':
          description: 'The snapshot is untagged, replace_manifest_id does not match, or the source plan violates graph integrity'

  /api/release-tracks/{id}/snapshots/{modified}/release:
    post:
      summary: 'Release a specific snapshot'
      operationId: 'release-tracks-release-by-modified'
      description: |
        Publish the snapshot selected by the modified timestamp using the same
        version-selection contract as the latest release operation:
        supply `increment` or `version`, never both; omit both for a minor
        increment. Virtual drafts must have composition_resolution from a
        successful materialization. For standard tracks, dynamic staged
        references are resolved to exact object revisions when this release
        request is handled. Standard tracks retain the selected source draft
        and create a tagged clone at the current time, including when the
        selected draft is historical. An optional `description` is stored as
        snapshot-local release notes. Relative increments use the latest
        tagged release.
      tags:
        - 'Release Tracks'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: modified
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        description: |
          Version selection. `increment` and `version` are mutually exclusive;
          supplying both returns 400. An empty object defaults to a minor
          increment. `description` optionally sets snapshot-local notes and is
          limited to 4000 characters.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: 'Snapshot released successfully'
        '400':
          description: 'Invalid release request'
        '409':
          description: 'Already released, another release is in progress, conflicting snapshot, or missing persisted primary revisions'
        '500':
          description: 'The release may be tagged, but durable membership-protection reconciliation failed'
          content:
            application/json:
              schema:
                $ref: '../components/release-tracks.yml#/components/schemas/release-track-reconciliation-error'
    put:
      summary: 'Change a release version'
      operationId: 'release-tracks-release-retag'
      description: |
        Administratively replace the semantic version assigned to a tagged
        snapshot without changing its identity or contents. The new version
        must remain strictly between the chronologically adjacent releases.
        Stored bundle hashes and the release catalogue are regenerated.
        The STIX 2.1 digest changes; STIX 2.0 omits the collection object and
        its digest is unchanged by a version-only correction. Hashes are
        prepared before writing and published atomically with the version.
        Retry the same version after a failure to finish history/catalogue
        reconciliation; a same-version request repairs derived state.
        Existing virtual snapshot provenance remains an immutable record of
        the version that was resolved at materialization time.
      tags:
        - 'Release Tracks'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: modified
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - version
              additionalProperties: false
              properties:
                version:
                  type: string
                  pattern: '^\d+\.\d+$'
      responses:
        '200':
          description: 'Release version changed successfully'
          content:
            application/json:
              schema:
                $ref: '../components/release-tracks.yml#/components/schemas/release-track-snapshot'
        '400':
          description: 'Invalid version body or release-lineage violation'
        '403':
          description: 'Changing a release version requires an administrator'
        '404':
          description: 'Snapshot not found'
        '409':
          description: 'Snapshot is a draft or another release operation is in progress'

  /api/release-tracks/{id}/snapshots/{modified}/release/preview:
    get:
      summary: 'Preview releasing a specific snapshot'
      operationId: 'release-tracks-preview-release-by-modified'
      description: |
        Plan without persisting. `increment` and `version` are mutually
        exclusive; omitting both defaults to a minor increment. For a virtual
        draft, compare against the latest tagged snapshot whose modified
        timestamp precedes this selected snapshot; never recompute composition.
        An unmaterialized virtual draft returns 409. Standard previews resolve
        dynamic staged references exactly as the corresponding release would.
        Summary responses include the exclusive lower and upper tagged
        snapshot version_bounds used by release planning.
      tags:
        - 'Release Tracks'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: modified
          in: path
          required: true
          schema:
            type: string
        - name: format
          in: query
          schema:
            type: string
            enum: [summary, workbench, bundle, filesystemstore]
            default: summary
        - name: increment
          in: query
          schema:
            type: string
            enum: [major, minor]
        - name: version
          in: query
          schema:
            type: string
        - name: include
          in: query
          description: |
            Workbench previews only: which tier arrays to return
            (members | staged | candidates | quarantine | all). Bundle
            previews reject it with 400.
          schema:
            type: string
        - name: stixVersion
          in: query
          schema:
            type: string
            enum: ['2.0', '2.1']
      responses:
        '200':
          description: 'Release preview generated'
        '409':
          description: 'Release is blocked because the draft is unmaterialized, conflicting, or references missing primary revisions'
        '501':
          description: 'Requested format is not yet implemented'
