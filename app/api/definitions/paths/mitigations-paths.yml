paths:
  /api/mitigations:
    get:
      summary: 'Get a list of mitigations'
      operationId: 'mitigation-get-all'
      description: |
        This endpoint gets a list of mitigations from the workspace.
        The list of mitigations may include multiple versions of each mitigation.
      tags:
        - 'Mitigations'
      parameters:
        - name: limit
          in: query
          description: |
            The number of mitigations to retrieve.
            The default (0) will retrieve all mitigations.
          schema:
            type: number
            default: 0
        - name: offset
          in: query
          description: |
            The number of mitigations to skip.
            The default (0) will start with the first mitigation.
          schema:
            type: number
            default: 0
        - name: domain
          in: query
          description: |
            Only retrieve objects that contain the specified domain in their `x_mitre_domains` array.
            This parameter may be set multiple times to retrieve objects with any of the provided domains.
          schema:
            oneOf:
              - type: string
              - type: array
                items:
                  type: string
          example: 'mobile-attack'
        - name: state
          in: query
          description: |
            State of the object in the editing workflow.
            If this parameter is not set, objects will be retrieved regardless of state.
            This parameter may be set multiple times to retrieve objects with any of the provided states.
          schema:
            oneOf:
              - type: string
              - type: array
                items:
                  type: string
          example: 'work-in-progress'
        - name: includeRevoked
          in: query
          description: |
            Whether to include objects that have the `revoked` property set to true.
          schema:
            type: boolean
            default: false
        - name: includeDeprecated
          in: query
          description: |
            Whether to include objects that have the `x_mitre_deprecated` property set to true.
          schema:
            type: boolean
            default: false
        - name: search
          in: query
          description: |
            Only return objects where the provided search text occurs in the `attack_id`, `name`, or `description`.
            The search is case-insensitive.
          schema:
            type: string
          allowReserved: true
          example: 'windows'
        - name: lastUpdatedBy
          in: query
          description: |
            The STIX ID of the user who last modified the object
          schema:
            oneOf:
              - type: string
              - type: array
                items:
                  type: string
          example: 'identity--f568ad89-69bc-48e7-877b-43755f1d376d'
        - name: includePagination
          in: query
          description: |
            Whether to include pagination data in the returned value.
            Wraps returned objects in a larger object.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: 'A list of mitigations.'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../components/mitigations.yml#/components/schemas/mitigation'

    post:
      x-exemption-report-response:
        $ref: '../components/validation-reports.yml#/components/schemas/operationReportResponse'
      summary: 'Create a mitigation'
      operationId: 'mitigation-create'
      description: |
        This endpoint creates a new mitigation in the workspace.
        If the `stix.id` property is set, it creates a new version of an existing mitigation.
        If the `stix.id` property is not set, it creates a new mitigation, generating a STIX id for it.
      tags:
        - 'Mitigations'
      parameters:
        - $ref: '../components/query-parameters.yml#/components/parameters/exemptionReport'
        - $ref: '../components/query-parameters.yml#/components/parameters/exemptionStatuses'
        - $ref: '../components/query-parameters.yml#/components/parameters/exemptionRuleIds'
        - $ref: '../components/query-parameters.yml#/components/parameters/exemptionLimit'
        - $ref: '../components/query-parameters.yml#/components/parameters/dryRun'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              # type: object
              $ref: '../components/mitigations.yml#/components/schemas/mitigation' # TODO delete after ADM integration complete
      responses:
        default:
          $ref: '../components/validation-reports.yml#/components/responses/operationError'
        '201':
          description: 'The mitigation has been successfully created.'
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '../components/mitigations.yml#/components/schemas/mitigation'
                  - $ref: '../components/validation-reports.yml#/components/schemas/operationReportResponse'
        '400':
          description: 'Missing or invalid parameters were provided. The mitigation was not created.'
          content:
            application/json:
              schema:
                $ref: '../components/validation-reports.yml#/components/schemas/operationErrorResponse'
            text/plain:
              schema:
                type: string
        '409':
          description: 'Duplicate `stix.id` and `stix.modified` properties. The mitigation was not created.'

          content:
            application/json:
              schema:
                $ref: '../components/validation-reports.yml#/components/schemas/operationErrorResponse'
            text/plain:
              schema:
                type: string
  /api/mitigations/{stixId}:
    get:
      summary: 'Get one or more versions of a mitigation'
      operationId: 'mitigation-get-one-id'
      description: |
        This endpoint gets a list of one or more versions of a mitigation from the workspace, identified by their STIX id.
      tags:
        - 'Mitigations'
      parameters:
        - name: stixId
          in: path
          description: 'STIX id of the mitigation to retrieve'
          required: true
          schema:
            type: string
        - name: versions
          in: query
          description: |
            The versions of the mitigation to retrieve.
            `all` gets all versions of the mitigation, `latest` gets only the latest version.
          schema:
            type: string
            enum:
              - all
              - latest
            default: latest
      responses:
        '200':
          description: 'A list of mitigations matching the requested STIX id.'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../components/mitigations.yml#/components/schemas/mitigation'
        '404':
          description: 'A mitigation with the requested STIX id was not found.'
    delete:
      summary: 'Delete a mitigation'
      operationId: 'mitigation-delete-all'
      description: |
        This endpoint deletes all versions of a mitigation from the workspace.
        The mitigation is identified by its STIX id.
      tags:
        - 'Mitigations'
      parameters:
        - name: stixId
          in: path
          description: 'STIX id of the mitigation to delete'
          required: true
          schema:
            type: string
      responses:
        '204':
          description: 'All the mitigation versions were successfully deleted.'
        '404':
          description: 'A mitigation with the requested STIX id was not found.'
        '409':
          description: 'STIX-changing PUTs conflict with revision immutability. Deletes conflict when the revision is pinned by release-track membership or an opt-in snapshot graph. Create a new revision instead.'

  /api/mitigations/{stixId}/modified/{modified}:
    get:
      summary: 'Gets the version of a mitigation matching the STIX id and modified date'
      operationId: 'mitigation-get-by-id-and-modified'
      description: |
        This endpoint gets a single version of a mitigation from the workspace, identified by its STIX id and modified date.
      tags:
        - 'Mitigations'
      parameters:
        - name: stixId
          in: path
          description: 'STIX id of the mitigation to retrieve'
          required: true
          schema:
            type: string
        - name: modified
          in: path
          description: 'modified date of the mitigation to retrieve'
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'The version of a mitigation matching the STIX id and modified date.'
          content:
            application/json:
              schema:
                $ref: '../components/mitigations.yml#/components/schemas/mitigation'
        '404':
          description: 'A mitigation with the requested STIX id and modified date was not found.'
    put:
      x-exemption-report-response:
        $ref: '../components/validation-reports.yml#/components/schemas/operationReportResponse'
      summary: 'Update a mitigation'
      operationId: 'mitigation-update'
      description: |
        This endpoint updates non-exported workspace metadata for one persisted STIX revision, identified by its STIX id and modified date. STIX content is immutable; create corrections as new POST revisions.
      tags:
        - 'Mitigations'
      parameters:
        - $ref: '../components/query-parameters.yml#/components/parameters/exemptionReport'
        - $ref: '../components/query-parameters.yml#/components/parameters/exemptionStatuses'
        - $ref: '../components/query-parameters.yml#/components/parameters/exemptionRuleIds'
        - $ref: '../components/query-parameters.yml#/components/parameters/exemptionLimit'
        - name: stixId
          in: path
          description: 'STIX id of the mitigation to update'
          required: true
          schema:
            type: string
        - name: modified
          in: path
          description: 'modified date of the mitigation to update'
          required: true
          schema:
            type: string
        - $ref: '../components/query-parameters.yml#/components/parameters/dryRun'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              # type: object
              $ref: '../components/mitigations.yml#/components/schemas/mitigation' # TODO delete after ADM integration complete
      responses:
        default:
          $ref: '../components/validation-reports.yml#/components/responses/operationError'
        '200':
          description: 'The mitigation was updated.'
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '../components/mitigations.yml#/components/schemas/mitigation'
                  - $ref: '../components/validation-reports.yml#/components/schemas/operationReportResponse'
        '400':
          description: 'Missing or invalid parameters were provided. The mitigation was not updated.'
          content:
            application/json:
              schema:
                $ref: '../components/validation-reports.yml#/components/schemas/operationErrorResponse'
            text/plain:
              schema:
                type: string
        '404':
          description: 'A mitigation with the requested STIX id and modified date was not found.'
          content:
            application/json:
              schema:
                $ref: '../components/validation-reports.yml#/components/schemas/operationErrorResponse'
            text/plain:
              schema:
                type: string
        '409':
          description: 'STIX-changing PUTs conflict with revision immutability. Deletes conflict when the revision is pinned by release-track membership or an opt-in snapshot graph. Create a new revision instead.'
          content:
            application/json:
              schema:
                $ref: '../components/validation-reports.yml#/components/schemas/operationErrorResponse'
            text/plain:
              schema:
                type: string
    delete:
      summary: 'Delete a mitigation'
      operationId: 'mitigation-delete'
      description: |
        This endpoint deletes a single version of a mitigation from the workspace.
        The mitigation is identified by its STIX id and modified date.
      tags:
        - 'Mitigations'
      parameters:
        - name: stixId
          in: path
          description: 'STIX id of the mitigation to delete'
          required: true
          schema:
            type: string
        - name: modified
          in: path
          description: 'modified date of the mitigation to delete'
          required: true
          schema:
            type: string
      responses:
        '204':
          description: 'The mitigation was successfully deleted.'
        '404':
          description: 'A mitigation with the requested STIX id and modified date was not found.'
        '409':
          description: 'STIX-changing PUTs conflict with revision immutability. Deletes conflict when the revision is pinned by release-track membership or an opt-in snapshot graph. Create a new revision instead.'

  /api/mitigations/{stixId}/revoke:
    post:
      x-exemption-report-response:
        $ref: '../components/validation-reports.yml#/components/schemas/operationReportResponse'
      summary: 'Revoke a mitigation'
      operationId: 'mitigation-revoke'
      description: |
        Revokes the mitigation identified by the stixId path parameter in favor of the revoking object specified in the request body.
        Optionally transfers relationships from the revoked object to the revoking object.
      tags:
        - 'Mitigations'
      parameters:
        - $ref: '../components/query-parameters.yml#/components/parameters/exemptionReport'
        - $ref: '../components/query-parameters.yml#/components/parameters/exemptionStatuses'
        - $ref: '../components/query-parameters.yml#/components/parameters/exemptionRuleIds'
        - $ref: '../components/query-parameters.yml#/components/parameters/exemptionLimit'
        - name: stixId
          in: path
          description: 'STIX id of the mitigation to revoke'
          required: true
          schema:
            type: string
        - name: preserveRelationships
          in: query
          description: 'Preserve active SROs and domain embedded references on the active latest replacement; retire original SROs as new revisions. Scalar conflicts or inactive referrers fail before writes; unexpected persistence failures are not transactional.'
          schema:
            type: boolean
            default: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - revoking
              properties:
                revoking:
                  type: object
                  required:
                    - stixId
                    - modified
                  properties:
                    stixId:
                      type: string
                      description: 'STIX id of the revoking (replacement) object'
                    modified:
                      type: string
                      description: 'Modified timestamp of the specific version of the revoking object'
      responses:
        default:
          $ref: '../components/validation-reports.yml#/components/responses/operationError'
        '200':
          description: 'The mitigation was successfully revoked.'
        '400':
          description: 'Missing or invalid parameters.'
          content:
            application/json:
              schema:
                $ref: '../components/validation-reports.yml#/components/schemas/operationErrorResponse'
            text/plain:
              schema:
                type: string
        '404':
          description: 'The mitigation or revoking object was not found.'
          content:
            application/json:
              schema:
                $ref: '../components/validation-reports.yml#/components/schemas/operationErrorResponse'
            text/plain:
              schema:
                type: string
        '409':
          description: 'Already revoked, inactive or stale replacement, embedded-reference conflict, inactive referrer, or concurrent graph write.'
          content:
            application/json:
              schema:
                $ref: '../components/validation-reports.yml#/components/schemas/operationErrorResponse'
            text/plain:
              schema:
                type: string
