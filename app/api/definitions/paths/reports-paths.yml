paths:
  /api/reports/link-by-id/missing:
    get:
      summary: 'Get objects with missing LinkById references'
      operationId: 'reports-get-missing-linkbyid'
      description: |
        This endpoint generates a list of ATT&CK objects and/or relationships that directly
        mention attack.mitre.org in their descriptions, indicating that they are likely missing
        a reference using the (LinkById: X####) pattern.
      tags:
        - 'Reports'
      parameters:
        - name: type
          in: query
          description: |
            Filter results by STIX type. If not specified, returns all types including relationships.
            Use 'relationship' to get only relationships, or use any ATT&CK object type
            (e.g., 'attack-pattern', 'x-mitre-tactic', 'intrusion-set', etc.) to filter by that type.
          schema:
            type: string
            enum:
              - relationship
              - attack-pattern
              - x-mitre-tactic
              - intrusion-set
              - malware
              - tool
              - course-of-action
              - x-mitre-data-source
              - x-mitre-data-component
              - x-mitre-asset
              - campaign
              - x-mitre-matrix
              - x-mitre-detection-strategy
              - x-mitre-analytic
          example: 'attack-pattern'
      responses:
        '200':
          description: 'A list of objects with missing LinkById references.'
          content:
            application/json:
              schema:
                type: array
                items:
                  anyOf:
                    - $ref: '../components/relationships.yml#/components/schemas/relationship'
                    - $ref: '../components/collections.yml#/components/schemas/collection'
                    - $ref: '../components/groups.yml#/components/schemas/group'
                    - $ref: '../components/identities.yml#/components/schemas/identity'
                    - $ref: '../components/marking-definitions.yml#/components/schemas/marking-definition'
                    - $ref: '../components/matrices.yml#/components/schemas/matrix'
                    - $ref: '../components/mitigations.yml#/components/schemas/mitigation'
                    - $ref: '../components/software.yml#/components/schemas/software'
                    - $ref: '../components/tactics.yml#/components/schemas/tactic'
                    - $ref: '../components/techniques.yml#/components/schemas/technique'
                    - $ref: '../components/analytics.yml#/components/schemas/analytic'
                    - $ref: '../components/detection-strategies.yml#/components/schemas/detection-strategy'
                    - $ref: '../components/assets.yml#/components/schemas/asset'
                    - $ref: '../components/campaigns.yml#/components/schemas/campaign'
                    - $ref: '../components/data-components.yml#/components/schemas/data-component'
                    - $ref: '../components/data-sources.yml#/components/schemas/data-source'
        '500':
          description: 'Server error'
          content:
            text/plain:
              schema:
                type: string
                example: 'Unable to get objects with missing LinkById. Server error.'

  /api/reports/domain-consistency:
    get:
      summary: 'Get the domain consistency report'
      operationId: 'reports-get-domain-consistency'
      description: |
        Release-track bundles never discover objects through relationships: a
        relationship ships only when both of its endpoints are members of the
        same track. This report lists the content that can never be published
        together as a result. `cross_domain_relationships` are the latest
        revisions of active relationships whose source and target objects
        share no `x_mitre_domains` value (each carries the latest
        `source_object` and `target_object` plus `source_domains` and
        `target_domains`). `objects_without_domains` are the latest revisions
        of active domain-bearing ATT&CK objects that declare no domain.
      tags:
        - 'Reports'
      responses:
        '200':
          description: 'Cross-domain relationships and objects without domains.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  cross_domain_relationships:
                    type: array
                    items:
                      type: object
                  objects_without_domains:
                    type: array
                    items:
                      type: object
                  summary:
                    type: object
                    properties:
                      cross_domain_relationship_count:
                        type: integer
                      objects_without_domains_count:
                        type: integer
        '500':
          description: 'Server error'
          content:
            text/plain:
              schema:
                type: string
                example: 'Unable to get the domain consistency report. Server error.'

  /api/reports/parallel-relationships:
    get:
      summary: 'Get parallel relationships'
      operationId: 'reports-get-parallel-relationships'
      description: |
        This endpoint generates a map of lists of parallel relationships. Within each list,
        the members share the same source_ref, target_ref, and relationship_type values.
        This is useful for identifying potentially duplicate relationships.
      tags:
        - 'Reports'
      responses:
        '200':
          description: 'A map of relationship keys to arrays of parallel relationships.'
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items:
                    $ref: '../components/relationships.yml#/components/schemas/relationship'
        '500':
          description: 'Server error'
          content:
            text/plain:
              schema:
                type: string
                example: 'Unable to get parallel relationships. Server error.'

  /api/reports/release-track-coverage:
    get:
      summary: 'Get the release-track coverage report'
      operationId: 'reports-get-release-track-coverage'
      description: |
        Read-only report over all stored revisions of supported domain-bearing
        ATT&CK SDOs, including revoked and deprecated objects. Relationships,
        identities, notes, marking definitions, and collections are excluded.
        Latest means greatest stix.modified per stix.id.
        untracked_latest_revisions contains latest revisions where the
        workspace.release_tracks key is absent and an older stored revision has
        a nonempty release_tracks array. Empty or null latest values do not match.
        never_enrolled_objects contains latest revisions of objects with no
        nonempty release_tracks array on any stored revision. This means no
        recorded membership, not proof that membership was never removed.
        Both lists are unique by STIX ID and sorted by STIX ID ascending.
        The response contains compact object summaries, not full revisions.
        Untracked findings include the most recent enrolled revision's modified,
        optional version, and all memberships, plus the number of unenrolled
        stored revisions strictly newer than it. Earlier gaps are not counted.
        Track names come from the current registry; unresolved names are omitted,
        retaining the membership ID. Compact latest objects include created and
        x_mitre_version when present.
        No enrollment or track_latest configuration is changed.
      tags:
        - 'Reports'
      responses:
        '200':
          description: 'Untracked latest revisions and objects with no recorded membership.'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - untracked_latest_revisions
                  - never_enrolled_objects
                  - summary
                properties:
                  untracked_latest_revisions:
                    type: array
                    items:
                      $ref: '../components/reports.yml#/components/schemas/untracked-latest-report-object'
                  never_enrolled_objects:
                    type: array
                    items:
                      $ref: '../components/reports.yml#/components/schemas/release-track-report-object'
                  summary:
                    type: object
                    additionalProperties: false
                    required:
                      - untracked_latest_revision_count
                      - never_enrolled_object_count
                    properties:
                      untracked_latest_revision_count:
                        type: integer
                        minimum: 0
                      never_enrolled_object_count:
                        type: integer
                        minimum: 0
        '500':
          description: 'Server error'
          content:
            text/plain:
              schema:
                type: string
                example: 'Unable to get the release-track coverage report. Server error.'
