paths:
  /api/config/system-version:
    get:
      summary: 'Get the REST API build information'
      operationId: 'config-get-system-version'
      description: |
        This public endpoint returns the REST API release version, Git commit,
        build date, and supported ATT&CK specification version. Container images
        source the build fields from the same values used for their OCI labels;
        non-container deployments use configured or package defaults.
      tags:
        - 'System Configuration'
      responses:
        '200':
          description: 'REST API build information'
          content:
            application/json:
              schema:
                $ref: '../components/system-configuration.yml#/components/schemas/system-version'

  /api/config/allowed-values:
    get:
      summary: 'Get the list of domain-specific allowed values'
      operationId: 'config-get-allowed-values'
      description: |
        Returns enabled, ADM-compliant runtime values in the existing nested shape.
        Configured field/domain tuples remain present even when empty. Invalid legacy
        settings are excluded regardless of validation flags or bypass rules.
        Changes are visible without restarting the API; existing STIX objects are not changed.
        Existing visitor-or-higher and read-only service access is unchanged.
      tags:
        - 'System Configuration'
      responses:
        '200':
          description: 'A list of allowed values.'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../components/system-configuration.yml#/components/schemas/allowed-values'

  /api/config/allowed-values/rules:
    get:
      summary: 'List runtime allowed-value rules'
      operationId: 'config-list-allowed-value-rules'
      description: |
        Administrator only. Returns one rule per configured propertyName/domainName,
        across object types, including persistent empty rules. Object types come from
        the backend ADM catalog. Equal value and enabled pairs are grouped; differing
        enabled states remain disjoint variants. Invalid legacy options appear only
        in invalidValues with reasons, not in selectable values.
      tags:
        - 'System Configuration'
      responses:
        '200':
          description: 'Configured rules with ADM-compliant enabled and disabled options, plus quarantined legacy options.'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../components/system-configuration.yml#/components/schemas/allowed-value-rule'
        '401':
          description: 'Authentication or administrator role required.'
    post:
      summary: 'Create an allowed-value property/domain rule'
      operationId: 'config-create-allowed-value-rule'
      description: |
        Administrator only. Creates a previously unconfigured catalog-supported group.
        Enabled and disabled options must conform to the installed backend ADM.
        Empty rules persist. Concurrent creation of the same group has one winner.
        General validation flags and validation bypass rules do not disable these checks.
      tags:
        - 'System Configuration'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../components/system-configuration.yml#/components/schemas/allowed-value-rule-create'
      responses:
        '201':
          description: 'Created configured rule.'
          content:
            application/json:
              schema:
                $ref: '../components/system-configuration.yml#/components/schemas/allowed-value-rule'
        '400':
          description: 'Invalid ADM property, domain, scope, or value.'
        '401':
          description: 'Authentication or administrator role required.'
        '409':
          description: 'Rule already exists, or overlapping duplicate option.'

  /api/config/allowed-values/catalog:
    get:
      summary: 'Get the authoritative backend ADM allowed-values catalog'
      operationId: 'config-get-allowed-value-catalog'
      description: |
        Administrator only. Lists all ADM-permitted domains for the original supported
        object/property pairs, not arbitrary ADM fields. Enum choices come directly
        from installed schemas and formatted suggestions are validated seed values.
        Identity uses the stix domain. Includes installed ADM version.
      tags:
        - 'System Configuration'
      responses:
        '200':
          description: 'ADM-supported definitions, including unconfigured groups.'
          content:
            application/json:
              schema:
                $ref: '../components/system-configuration.yml#/components/schemas/allowed-value-catalog'
        '401':
          description: 'Authentication or administrator role required.'

  /api/config/allowed-values/validate:
    post:
      summary: 'Validate an allowed value without changing configuration'
      operationId: 'config-validate-allowed-value'
      description: |
        Administrator only. Applies the same unconditional ADM scope and value checks
        as final writes and returns the trimmed value. The group need not be configured.
      tags:
        - 'System Configuration'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../components/system-configuration.yml#/components/schemas/allowed-value-validate'
      responses:
        '200':
          description: 'Validated, trimmed value.'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [value]
                properties:
                  value:
                    type: string
        '400':
          description: 'Invalid ADM property, domain, scope, or value.'
        '401':
          description: 'Authentication or administrator role required.'

  /api/config/allowed-values/rules/{propertyName}/{domainName}:
    parameters:
      - name: propertyName
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      - name: domainName
        in: path
        required: true
        schema:
          type: string
          minLength: 1
    put:
      summary: 'Replace the complete option set for an allowed-value rule'
      operationId: 'config-replace-allowed-value-rule'
      description: |
        Administrator only. Atomically replaces only this property/domain group's
        values, retaining unrelated rules even during concurrent saves. The rule
        must already be configured; each enabled or disabled option requires a nonempty
        ADM-valid trimmed value, a boolean enabled state, and distinct supported objectTypes.
        The same value cannot occur more than once for an object type, including disabled
        options. Disjoint variants are allowed. Empty values clear the rule without
        removing it. Saving also replaces any quarantined legacy options.
        ADM checks cannot be disabled by general validation flags or bypass rules.
      tags:
        - 'System Configuration'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../components/system-configuration.yml#/components/schemas/allowed-value-rule-replace'
      responses:
        '200':
          description: 'Full updated rule, including all supported object types.'
          content:
            application/json:
              schema:
                $ref: '../components/system-configuration.yml#/components/schemas/allowed-value-rule'
        '400':
          description: 'Invalid request body, unsupported rule, or ADM-invalid value or scope.'
        '401':
          description: 'Authentication or administrator role required.'
        '404':
          description: 'The catalog-supported rule has not been configured.'
        '409':
          description: 'A value is repeated for the same object type within this rule.'

  /api/config/organization-identity:
    get:
      summary: 'Get the designated organization identity'
      operationId: 'config-get-organization-identity'
      description: |
        This endpoint gets the organization identity object for the system.
      tags:
        - 'System Configuration'
      responses:
        '200':
          description: 'An identity object.'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../components/identities.yml#/components/schemas/identity'
    post:
      parameters:
        - $ref: '../components/query-parameters.yml#/components/parameters/exemptionReport'
        - $ref: '../components/query-parameters.yml#/components/parameters/exemptionStatuses'
        - $ref: '../components/query-parameters.yml#/components/parameters/exemptionRuleIds'
        - $ref: '../components/query-parameters.yml#/components/parameters/exemptionLimit'
      x-exemption-report-response:
        $ref: '../components/validation-reports.yml#/components/schemas/operationReportResponse'
      summary: 'Set the designated organization identity'
      operationId: 'config-set-organization-identity'
      description: |
        This endpoint sets the organization identity for the system.
        The identity object must already exist.
      tags:
        - 'System Configuration'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../components/system-configuration.yml#/components/schemas/organization-identity'
      responses:
        default:
          $ref: '../components/validation-reports.yml#/components/responses/operationError'
        '204':
          headers:
            X-Validation-Report-Id:
              description: 'Opaque retained report ID for GET /api/validation-reports/{reportId}. Present only if retained.'
              schema:
                type: string
            X-Validation-Report-Availability:
              description: 'retained or unavailable; preserves the original successful204 result.'
              schema:
                type: string
            X-Validation-Report-State:
              description: 'completed or partial.'
              schema:
                type: string
            X-Validation-Report-Policy-Revision:
              description: 'Operation policy revision.'
              schema:
                type: string
            X-Validation-Report-Exempt-Revisions:
              description: 'Selected distinct exempt revision count.'
              schema:
                type: string
            X-Validation-Report-Rule-Applications:
              description: 'Selected matching rule application count.'
              schema:
                type: string
          description: 'The organization identity has been successfully set.'
        '400':
          description: 'Missing or invalid parameters were provided. The organization identity was not set.'
          content:
            application/json:
              schema:
                $ref: '../components/validation-reports.yml#/components/schemas/operationErrorResponse'
            text/plain:
              schema:
                type: string
        '404':
          description: 'The identity could not be found. The organization identity was not set.'

          content:
            application/json:
              schema:
                $ref: '../components/validation-reports.yml#/components/schemas/operationErrorResponse'
            text/plain:
              schema:
                type: string
  /api/config/authn:
    get:
      summary: 'Get information describing the available user authentication mechanisms'
      operationId: 'config-get-authn'
      description: |
        This endpoint gets information describing the available user authentication mechanisms.
        This is intended to be used by the client to determine which authentication mechanisms are available to be used and does not require the user to be logged in.
      tags:
        - 'System Configuration'
      responses:
        '200':
          description: 'A list of available authentication mechanisms.'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../components/system-configuration.yml#/components/schemas/authn-mechanism'

  /api/config/default-marking-definitions:
    get:
      summary: 'Get the default marking definitions'
      operationId: 'config-get-default-marking-definitions'
      description: |
        This endpoint gets the default marking definition objects for the system.
      tags:
        - 'System Configuration'
      parameters:
        - name: refOnly
          in: query
          description: |
            Only return the STIX ID of the default marking definitions instead of the objects.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: 'An array of marking definition objects.'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../components/marking-definitions.yml#/components/schemas/marking-definition'
    post:
      summary: 'Set the default marking definitions'
      operationId: 'config-set-default-marking-definitions'
      description: |
        This endpoint sets the default marking definitions for the system.
        The marking definitions must already exist.
      tags:
        - 'System Configuration'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../components/system-configuration.yml#/components/schemas/default-marking-definition-ids'
      responses:
        '204':
          description: 'The default marking definitions have been successfully set.'
        '400':
          description: 'Missing or invalid parameters were provided. The default marking definitions were not set.'
        '404':
          description: 'A marking definition could not be found. The default marking definitions were not set.'

  /api/config/organization-namespace:
    get:
      summary: 'Get the designated organization namespace'
      operationId: 'config-get-organization-namespace'
      description: |
        This endpoint gets the organization namespace definition (if any) defined for the system.
      tags:
        - 'System Configuration'
      responses:
        '200':
          description: 'A namespace object.'
          content:
            application/json:
              schema:
                $ref: '../components/system-configuration.yml#/components/schemas/organization-namespace'
    post:
      parameters:
        - $ref: '../components/query-parameters.yml#/components/parameters/exemptionReport'
        - $ref: '../components/query-parameters.yml#/components/parameters/exemptionStatuses'
        - $ref: '../components/query-parameters.yml#/components/parameters/exemptionRuleIds'
        - $ref: '../components/query-parameters.yml#/components/parameters/exemptionLimit'
      x-exemption-report-response:
        $ref: '../components/validation-reports.yml#/components/schemas/operationReportResponse'
      summary: 'Set the designated organization namespace'
      operationId: 'config-set-organization-namespace'
      description: |
        This endpoint sets the organization namespace for the system.
      tags:
        - 'System Configuration'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../components/system-configuration.yml#/components/schemas/organization-namespace'
      responses:
        default:
          $ref: '../components/validation-reports.yml#/components/responses/operationError'
        '204':
          headers:
            X-Validation-Report-Id:
              description: 'Opaque retained report ID for GET /api/validation-reports/{reportId}. Present only if retained.'
              schema:
                type: string
            X-Validation-Report-Availability:
              description: 'retained or unavailable; preserves the original successful204 result.'
              schema:
                type: string
            X-Validation-Report-State:
              description: 'completed or partial.'
              schema:
                type: string
            X-Validation-Report-Policy-Revision:
              description: 'Operation policy revision.'
              schema:
                type: string
            X-Validation-Report-Exempt-Revisions:
              description: 'Selected distinct exempt revision count.'
              schema:
                type: string
            X-Validation-Report-Rule-Applications:
              description: 'Selected matching rule application count.'
              schema:
                type: string
          description: 'The organization namespace has been successfully set.'
        '400':
          description: 'Missing or invalid parameters were provided. The organization namespace was not set.'

          content:
            application/json:
              schema:
                $ref: '../components/validation-reports.yml#/components/schemas/operationErrorResponse'
            text/plain:
              schema:
                type: string
  /api/config/mitre-identity-writes:
    get:
      summary: 'Get the MITRE identity write protection setting'
      operationId: 'config-get-mitre-identity-writes'
      description: |
        This endpoint gets whether create and update requests for the protected MITRE identity are enabled.
      tags:
        - 'System Configuration'
      responses:
        '200':
          description: 'The MITRE identity write protection setting.'
          content:
            application/json:
              schema:
                $ref: '../components/system-configuration.yml#/components/schemas/mitre-identity-writes'
    post:
      summary: 'Set the MITRE identity write protection setting'
      operationId: 'config-set-mitre-identity-writes'
      description: |
        This endpoint sets whether create and update requests for the protected MITRE identity are enabled.
      tags:
        - 'System Configuration'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../components/system-configuration.yml#/components/schemas/mitre-identity-writes'
      responses:
        '204':
          description: 'The MITRE identity write protection setting has been successfully set.'
        '400':
          description: 'Missing or invalid parameters were provided. The MITRE identity write protection setting was not set.'

  /api/config/validation-bypasses:
    get:
      summary: 'Get validation bypass rules'
      operationId: 'config-get-validation-bypasses'
      description: |
        This endpoint gets legacy error bypass rules and whole-object retirement exemption rules.
      tags:
        - 'Validation Bypasses'
      parameters:
        - name: limit
          in: query
          description: |
            The number of validation bypass rules to retrieve.
            The default (0) will retrieve all rules.
          schema:
            type: number
            default: 0
        - name: offset
          in: query
          description: |
            The number of validation bypass rules to skip.
            The default (0) will start with the first rule.
          schema:
            type: number
            default: 0
        - name: includePagination
          in: query
          description: |
            Whether to include pagination data in the returned value.
            Wraps returned objects in a larger object.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: 'A list of validation bypass rules.'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../components/system-configuration.yml#/components/schemas/validation-bypass-rule'
    post:
      summary: 'Create a validation bypass rule'
      operationId: 'config-create-validation-bypass'
      description: |
        This endpoint creates an error bypass or an object exemption. Missing kind selects the legacy error bypass contract. Exemption selectors must be unique after normalization; any enabled matching exemption grants exclusion from ADM.
      tags:
        - 'Validation Bypasses'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../components/system-configuration.yml#/components/schemas/validation-bypass-rule'
      responses:
        '201':
          description: 'The validation bypass rule was created.'
          content:
            application/json:
              schema:
                $ref: '../components/system-configuration.yml#/components/schemas/validation-bypass-rule'
        '400':
          description: 'Missing or invalid parameters were provided. The validation bypass rule was not created.'
        '409':
          description: 'A matching validation bypass rule already exists.'

  /api/config/validation-bypasses/reconciliation:
    get:
      summary: 'Get durable validation reconciliation status'
      operationId: 'config-validation-reconciliation-status'
      description: 'Administrator only. Cleanup runs independently of ENABLE_SCHEDULER; policy enforcement is immediate.'
      tags:
        - 'Validation Bypasses'
      responses:
        '200':
          description: 'Latest durable reconciliation intent and progress.'
          content:
            application/json:
              schema:
                $ref: '../components/system-configuration.yml#/components/schemas/validation-reconciliation'
        '401':
          description: 'Administrator role required.'

  /api/config/validation-bypasses/reconciliation/retry:
    post:
      summary: 'Retry failed validation reconciliation'
      operationId: 'config-validation-reconciliation-retry'
      description: 'Administrator only. Cleanup runs independently of ENABLE_SCHEDULER; policy enforcement is immediate.'
      tags:
        - 'Validation Bypasses'
      responses:
        '200':
          description: 'Latest durable reconciliation intent and progress.'
          content:
            application/json:
              schema:
                $ref: '../components/system-configuration.yml#/components/schemas/validation-reconciliation'
        '401':
          description: 'Administrator role required.'

  /api/config/validation-bypasses/{id}:
    get:
      summary: 'Get a validation bypass rule'
      operationId: 'config-get-validation-bypass'
      description: |
        This endpoint gets a validation bypass rule by its database id.
      tags:
        - 'Validation Bypasses'
      parameters:
        - name: id
          in: path
          description: 'Database id of the validation bypass rule.'
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'A validation bypass rule.'
          content:
            application/json:
              schema:
                $ref: '../components/system-configuration.yml#/components/schemas/validation-bypass-rule'
        '404':
          description: 'A validation bypass rule with the requested id was not found.'
    put:
      summary: 'Update a validation bypass rule'
      operationId: 'config-update-validation-bypass'
      description: |
        This endpoint updates a validation bypass rule by its database id.
      tags:
        - 'Validation Bypasses'
      parameters:
        - name: id
          in: path
          description: 'Database id of the validation bypass rule.'
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../components/system-configuration.yml#/components/schemas/validation-bypass-rule'
      responses:
        '200':
          description: 'The validation bypass rule was updated.'
          content:
            application/json:
              schema:
                $ref: '../components/system-configuration.yml#/components/schemas/validation-bypass-rule'
        '400':
          description: 'Missing or invalid parameters were provided. The validation bypass rule was not updated.'
        '404':
          description: 'A validation bypass rule with the requested id was not found.'
        '409':
          description: 'A matching validation bypass rule already exists.'
    delete:
      summary: 'Delete a validation bypass rule'
      operationId: 'config-delete-validation-bypass'
      description: |
        This endpoint deletes a validation bypass rule by its database id.
      tags:
        - 'Validation Bypasses'
      parameters:
        - name: id
          in: path
          description: 'Database id of the validation bypass rule.'
          required: true
          schema:
            type: string
      responses:
        '204':
          description: 'The validation bypass rule was deleted.'
        '404':
          description: 'A validation bypass rule with the requested id was not found.'
